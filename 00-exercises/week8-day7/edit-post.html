<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Post</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="section">
        <h1>Edite su post</h1>

        <form class="form_posts">
            <input name="title" type="text" placeholder="Título">
            <select name="category"></select>
            <input name="content" type="text" placeholder="Contenido">
            <input name="summary" type="text" placeholder="Resumen">
            <button type="submit" id="edit">Guardar</button>
            <button type="button" id="btn-cancelar">Cancelar</button>
        </form>
    </div>

    <script type="module" src="js/update-post.js"></script>
</body>
</html>
