<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- NAVBAR — Flexbox: logo izquierda, links derecha -->
    <nav class="navbar">
        <span class="navbar-logo">Mini Blog</span>
        <div class="navbar-links">
            <a href="#">Inicio</a>
            <a href="#">Sobre mí</a>
        </div>
    </nav>

    <main class="container" id = "posts-contenedor">
        <div class="posts-grid" id = "posts-grid"></div>
        <button id ="btn-cargar" class="btn btn-primario btn-lg">Cargar Posts</button>
            <div class="section">
                <h1>Ingrese su post</h1>

                <form class="form_posts">
                    <input name="title" type="text" placeholder="Título">
                    <select name="category"></select>
                    <input name="content" type="text" placeholder="Contenido">
                    <input name="summary" type="text" placeholder="Resumen">
                    <button type="submit">Publicar</button>
                </form>
            </div>
        </div>
    </main>

    <!-- type="module" habilita import/export -->
    <script type="module" src="js/index.js"></script>
    <script type="module" src="js/create-post.js"></script>
    <script type="module" src="js/delete-post.js"></script>
    <footer class="footer">
     <p>© 2025 Mini Blog — Hecho con ❤️</p>
    </footer>
</body>
</html>
