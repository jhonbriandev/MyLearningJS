<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:          #0b0e14;
            --surface:     #131820;
            --border:      #1e2635;
            --accent:      #4f8ef7;
            --accent-glow: rgba(79,142,247,.18);
            --text:        #e8eaf0;
            --muted:       #5a647a;
            --error:       #f26b6b;
            --radius:      14px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2.8rem;
            width: min(420px, 92vw);
            box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.5), 0 0 80px var(--accent-glow);
            animation: fadeUp .45s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logo-mark {
            width: 42px; height: 42px;
            background: var(--accent);
            border-radius: 10px;
            display: grid;
            place-items: center;
            margin-bottom: 1.6rem;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -.02em;
            margin-bottom: .35rem;
        }
        .subtitle { color: var(--muted); font-size: .88rem; margin-bottom: 2rem; }
        .field { margin-bottom: 1.1rem; }
        label {
            display: block;
            font-size: .78rem;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: .45rem;
        }
        input {
            width: 100%;
            padding: .75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        button[type="submit"] {
            width: 100%;
            margin-top: .6rem;
            padding: .82rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-size: .97rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .15s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        button[type="submit"]:hover  { opacity: .9; transform: translateY(-1px); }
        button[type="submit"]:active { transform: translateY(0); }
        #error-msg:not(:empty) {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: rgba(242,107,107,.1);
            border: 1px solid rgba(242,107,107,.3);
            color: var(--error);
            border-radius: 8px;
            padding: .7rem 1rem;
            font-size: .86rem;
            margin-top: 1rem;
            animation: shake .3s ease;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }
        .card-footer {
            margin-top: 1.6rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: .8rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-mark">AP</div>
        <h1>Bienvenido</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form id="form-login" novalidate>
            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username"
                       placeholder="tu_usuario" autocomplete="username" required />
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" autocomplete="current-password" required />
            </div>
            <button type="submit">Iniciar sesión</button>
            <p id="error-msg"></p>
        </form>

        <p class="card-footer">Sistema protegido · Solo acceso autorizado</p>
    </div>

    <!-- src apunta a la carpeta js/ -->
    <script type="module" src="./js/login.js"></script>
</body>
</html>
